<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>I Don't Want To Wait — Skili</title>
  <style>
    :root {
      --accent: #ffffff;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, sans-serif;
      color: #f2f2f2;
      background: radial-gradient(circle at 50% 40%, #111 0%, #0a0a0a 40%, #000 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: url('images_iwybms/Artwork_IWYBMS.png') center center / cover no-repeat;

      background-blend-mode: overlay, screen, overlay;
      opacity: 0.35;
      mix-blend-mode: lighten;
      pointer-events: none;
      animation: subtleShift 16s ease-in-out infinite alternate;
    }

    @keyframes subtleShift {
      0% { transform: scale(1) translate(0,0); opacity: 0.3; }
      100% { transform: scale(1.05) translate(-2%, 2%); opacity: 0.45; }
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
      position: relative;
      z-index: 1;
    }

    .artwork {
      width: 260px;
      height: 260px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
      margin-bottom: 24px;
    }
    .artwork img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(0%) contrast(1.15);
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      color: #fff;
      letter-spacing: -0.5px;
    }
    p {
      opacity: 0.85;
      margin-bottom: 30px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 300px;
    }
    .btn {
  display: block;
  width: 100%;
  padding: 14px 0;
  border-radius: 12px;
  border: none;
  background: #f8e8d8; /* volle, helle Cremefarbe */
  color: #1a1a1a; /* dunkler Text für guten Kontrast */
  font-weight: 600;
  text-decoration: none;
  transition: background 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
}

.btn:hover {
  background: #fff1e2; /* etwas heller beim Hover */
  box-shadow: 0 0 14px rgba(248, 232, 216, 0.6);
  transform: translateY(-2px);
}




    footer {
      text-align: center;
      padding: 20px;
      opacity: 0.5;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="artwork">
      <img src="images_iwybms/Artwork_IWYBMS.png" alt="I Want You By My Side Artwork">
    </div>
    <h1>I Want You By My Side</h1>
    <p>by Skili</p>

    <div class="links">
      <a href="https://open.spotify.com/track/57qSYMIoF8EXGK6FMNEV39?si=5ac7ca2888e447ca" target="_blank" class="btn">Spotify</a>
      <a href="https://music.apple.com/at/album/i-want-you-by-my-side/1848388183?i=1848388184&l=en-GB" target="_blank" class="btn">Apple Music</a>
      <a href="https://soundcloud.com/skili-music/popular-tracks" target="_blank" class="btn">SoundCloud</a>
      <a href="https://music.youtube.com/channel/UC5er52P2O78sBq_Tkg4xfeg" target="_blank" class="btn">YouTube Music</a>
    </div>
  </main>

  <footer>© 2025 Skili</footer>
</body>
</html>
